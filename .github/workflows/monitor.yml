name: Sarkissian Site Monitor

on:
  schedule:
    # Աշխատելու է ամեն օր Երևանի ժամանակով առավոտյան 07:00-ին (UTC-ով՝ 03:00-ին)
    - cron: '0 3 * * *'
  workflow_dispatch: # Թույլ է տալիս ձեռքով միացնել կոճակով

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Save snapshots back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update site snapshots automatically"
          skip_ci: true
          push_options: '--force'
