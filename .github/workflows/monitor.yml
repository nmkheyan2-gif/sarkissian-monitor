name: Sarkissian Site Monitor

on:
  schedule:
    # Ամեն օր Երևանի ժամանակով 07:00 (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch:

# Չի թողնի, որ նույն workflow-ն միաժամանակ երկու անգամ push անի
concurrency:
  group: sarkissian-site-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitoring script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Commit and push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snapshots/

          if git diff --cached --quiet; then
            echo "No snapshot changes detected."
            exit 0
          fi

          git commit -m "Update site snapshots automatically"

          for i in 1 2 3 4 5
          do
            echo "Push attempt $i..."

            git pull --rebase origin main

            if git push origin main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed, retrying in 5 seconds..."
            sleep 5
          done

          echo "ERROR: Could not push changes after 5 attempts."
          exit 1
