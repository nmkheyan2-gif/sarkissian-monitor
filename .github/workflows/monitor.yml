name: Sarkissian Site Monitor

on:
  schedule:
    - cron: '0 3 * * *'  # Ամեն օր Երևանի ժամանակով 07:00-ին
  workflow_dispatch:      # Ձեռքով գործարկելու հնարավորություն

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Կարևոր է, որ actions-ը գրելու իրավունք ունենա

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run monitoring script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Save snapshots back to repo safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Թարմացնում ենք տեղական ճյուղը հեռավորից, որպեսզի կոնֆլիկտ չլինի
          git pull origin main --rebase || true
          
          # 2. Ավելացնում ենք նոր կամ փոփոխված snapshots ֆայլերը
          git add snapshots/
          
          # 3. Ստուգում ենք՝ արդյոք կան փոփոխություններ պահպանելու
          git diff --staged --quiet || git commit -m "Update site snapshots automatically"
          
          # 4. Ուղարկում ենք GitHub
          git push origin main
